<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#82072a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Budget">
    <title>Budget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bordeaux:      #82072a;
            --bordeaux-lite: #a81038;
            --bordeaux-bg:   #fdf2f4;
            --bg:            #f2f4f7;
            --white:         #ffffff;
            --surface2:      #f8f9fb;
            --border:        #e8eaee;
            --border-strong: #d4d8df;
            --text:          #1a1d23;
            --text-mid:      #4a5060;
            --text-muted:    #8c909a;
            --red:           #dc2626;
            --red-bg:        #fef2f2;
            --green:         #16a34a;
            --green-bg:      #f0fdf4;
            --shadow-sm:     0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow:        0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body { height:100%; background:var(--bg); color:var(--text); font-family:'Barlow',sans-serif; font-size:15px; -webkit-user-select:none; user-select:none; overscroll-behavior:none; }
        input, select { -webkit-user-select:text; user-select:text; }
        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:var(--border-strong); border-radius:4px; }

        /* ── LOCK ── */
        .lock-screen { position:fixed; inset:0; background:var(--bg); z-index:999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 32px; }
        .lock-logo { width:72px; height:72px; background:var(--bordeaux); border-radius:20px; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:34px; color:white; margin-bottom:24px; box-shadow:0 8px 24px rgba(130,7,42,0.35); }
        .lock-title { font-family:'Barlow Condensed',sans-serif; font-size:28px; font-weight:700; color:var(--text); margin-bottom:6px; }
        .lock-sub { font-size:13px; color:var(--text-muted); margin-bottom:36px; text-align:center; line-height:1.5; }
        .pin-dots { display:flex; gap:18px; margin-bottom:12px; }
        .pin-dot { width:16px; height:16px; border-radius:50%; border:2px solid var(--border-strong); background:transparent; transition:all 0.15s; }
        .pin-dot.filled { background:var(--bordeaux); border-color:var(--bordeaux); transform:scale(1.15); }
        .pin-dot.error { background:var(--red); border-color:var(--red); }
        .lock-error { font-size:13px; font-weight:600; color:var(--red); height:20px; text-align:center; margin-bottom:20px; }
        .pin-pad { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; width:100%; max-width:272px; }
        .pin-key { background:var(--white); border:1px solid var(--border); border-radius:16px; padding:18px; font-family:'Barlow Condensed',sans-serif; font-size:26px; font-weight:700; color:var(--text); cursor:pointer; text-align:center; box-shadow:var(--shadow-sm); transition:all 0.12s; }
        .pin-key:active { transform:scale(0.93); background:var(--surface2); }
        .pin-key.empty { background:transparent; border-color:transparent; box-shadow:none; cursor:default; }
        .pin-key.del { color:var(--bordeaux); font-size:18px; }
        .bio-btn { margin-top:22px; background:none; border:2px solid rgba(130,7,42,0.2); border-radius:12px; color:var(--bordeaux); font-family:'Barlow',sans-serif; font-size:14px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:8px; padding:12px 20px; transition:all 0.2s; }
        .bio-btn:hover { background:var(--bordeaux-bg); }

        /* ── APP ── */
        #app { min-height:100vh; padding-bottom:96px; }

        .header { position:sticky; top:0; z-index:100; background:rgba(255,255,255,0.88); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-bottom:1px solid var(--border); padding:14px 20px; display:flex; justify-content:space-between; align-items:center; }
        .header-logo { display:flex; align-items:center; gap:10px; }
        .logo-dot { width:32px; height:32px; background:var(--bordeaux); border-radius:9px; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:15px; color:white; box-shadow:0 2px 8px rgba(130,7,42,0.35); }
        .header-title { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:22px; letter-spacing:0.3px; }
        .btn-icon { width:38px; height:38px; border-radius:10px; background:var(--surface2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-mid); transition:all 0.2s; box-shadow:var(--shadow-sm); }
        .btn-icon:hover { background:var(--white); color:var(--bordeaux); }
        .btn-icon svg { width:18px; height:18px; }

        .hero { margin:16px 16px 0; background:var(--bordeaux); border-radius:22px; padding:26px 22px 22px; position:relative; overflow:hidden; box-shadow:0 8px 32px rgba(130,7,42,0.30); }
        .hero::before { content:''; position:absolute; top:-50px; right:-50px; width:200px; height:200px; background:rgba(255,255,255,0.06); border-radius:50%; }
        .hero::after { content:''; position:absolute; bottom:-70px; left:-30px; width:160px; height:160px; background:rgba(0,0,0,0.10); border-radius:50%; }
        .hero-label { font-size:11px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:rgba(255,255,255,0.55); margin-bottom:6px; position:relative; z-index:1; }
        .hero-amount { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:54px; line-height:1; color:white; letter-spacing:-1px; margin-bottom:22px; position:relative; z-index:1; }
        .hero-stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; position:relative; z-index:1; }
        .hero-stat { background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.15); border-radius:12px; padding:12px 14px; }
        .hero-stat-label { font-size:10px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:rgba(255,255,255,0.55); margin-bottom:4px; }
        .hero-stat-value { font-family:'Barlow Condensed',sans-serif; font-size:24px; font-weight:700; color:white; }
        .hero-stat-value.negative { color:#fca5a5; }
        .hero-stat-value.positive { color:#86efac; }
        .alert-badge { margin-top:12px; position:relative; z-index:1; background:rgba(255,255,255,0.12); border:1px solid rgba(255,100,100,0.4); border-radius:10px; padding:10px 14px; display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:#fca5a5; }

        .progress-card { margin:12px 16px 0; background:var(--white); border:1px solid var(--border); border-radius:16px; padding:16px 18px; box-shadow:var(--shadow-sm); }
        .progress-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
        .progress-label { font-size:12px; font-weight:600; color:var(--text-mid); }
        .progress-pct { font-family:'Barlow Condensed',sans-serif; font-size:20px; font-weight:700; color:var(--bordeaux); }
        .progress-bar { height:6px; background:var(--surface2); border-radius:3px; overflow:hidden; border:1px solid var(--border); }
        .progress-fill { height:100%; border-radius:3px; transition:width 0.6s ease; }

        .section-title { font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--text-muted); padding:20px 20px 10px; }

        .bars-card { margin:0 16px; background:var(--white); border:1px solid var(--border); border-radius:16px; padding:16px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:14px; }
        .bar-row { display:flex; align-items:center; gap:12px; }
        .bar-icon { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
        .bar-info { flex:1; min-width:0; }
        .bar-name { font-size:13px; font-weight:600; color:var(--text); margin-bottom:5px; }
        .bar-track { height:5px; background:var(--surface2); border-radius:3px; overflow:hidden; border:1px solid var(--border); }
        .bar-fill { height:100%; border-radius:3px; transition:width 0.6s ease; }
        .bar-amount { font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:700; color:var(--text-mid); min-width:52px; text-align:right; }

        .tx-list { padding:0 16px; display:flex; flex-direction:column; gap:8px; }
        .tx-item { background:var(--white); border:1px solid var(--border); border-radius:14px; padding:13px 14px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-sm); transition:all 0.2s; position:relative; }
        .tx-item:hover { box-shadow:var(--shadow); border-color:var(--border-strong); }
        .tx-icon { width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
        .tx-info { flex:1; min-width:0; }
        .tx-cat { font-size:14px; font-weight:600; color:var(--text); }
        .tx-meta { font-size:11px; color:var(--text-muted); margin-top:2px; }
        .tx-amount { font-family:'Barlow Condensed',sans-serif; font-size:18px; font-weight:700; color:var(--bordeaux); flex-shrink:0; }
        .tx-delete { position:absolute; right:10px; top:50%; transform:translateY(-50%); width:28px; height:28px; border-radius:8px; background:var(--red-bg); border:1px solid rgba(220,38,38,0.15); color:var(--red); cursor:pointer; align-items:center; justify-content:center; font-size:13px; display:none; }
        .tx-item:hover .tx-delete { display:flex; }
        .tx-item:hover .tx-amount { opacity:0; }

        .empty-state { text-align:center; padding:40px 20px; }
        .empty-icon { font-size:48px; display:block; margin-bottom:12px; opacity:0.4; }
        .empty-text { font-size:14px; color:var(--text-muted); }

        .fab { position:fixed; bottom:90px; right:20px; width:54px; height:54px; background:var(--bordeaux); border-radius:16px; border:none; color:white; font-size:28px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 20px rgba(130,7,42,0.40); transition:all 0.2s; z-index:90; }
        .fab:hover { background:var(--bordeaux-lite); transform:translateY(-2px); }
        .fab:active { transform:scale(0.95); }

        .bottom-nav { position:fixed; bottom:0; left:0; right:0; height:72px; background:rgba(255,255,255,0.92); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-top:1px solid var(--border); display:flex; justify-content:space-around; align-items:center; padding:0 16px; z-index:80; box-shadow:0 -4px 16px rgba(0,0,0,0.06); }
        .nav-item { display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-muted); cursor:pointer; transition:color 0.2s; flex:1; padding:8px 0; }
        .nav-item.active { color:var(--bordeaux); }
        .nav-item svg { width:22px; height:22px; }
        .nav-item span { font-size:10px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; }

        /* ── MODAL ── */
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.35); backdrop-filter:blur(6px); z-index:200; display:flex; align-items:flex-end; animation:fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        .modal-sheet { width:100%; background:var(--white); border-top:1px solid var(--border); border-radius:26px 26px 0 0; padding:24px 22px 40px; animation:slideUp 0.3s cubic-bezier(0.4,0,0.2,1); box-shadow:0 -8px 32px rgba(0,0,0,0.12); }
        @keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
        .modal-handle { width:36px; height:4px; background:var(--border-strong); border-radius:2px; margin:0 auto 22px; }
        .modal-title { font-family:'Barlow Condensed',sans-serif; font-size:26px; font-weight:700; color:var(--text); margin-bottom:22px; display:flex; justify-content:space-between; align-items:center; }
        .modal-close { width:30px; height:30px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-muted); font-size:14px; transition:all 0.2s; }
        .modal-close:hover { background:var(--bordeaux-bg); color:var(--bordeaux); }
        .form-group { margin-bottom:16px; }
        .form-label { font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px; display:block; }
        .form-input { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:13px 16px; color:var(--text); font-family:'Barlow',sans-serif; font-size:15px; transition:all 0.2s; appearance:none; -webkit-appearance:none; }
        .form-input:focus { outline:none; border-color:var(--bordeaux); background:var(--white); box-shadow:0 0 0 3px rgba(130,7,42,0.08); }
        .form-input.big { font-family:'Barlow Condensed',sans-serif; font-size:34px; font-weight:700; }
        .cats-picker { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
        .cat-pick { background:var(--surface2); border:2px solid var(--border); border-radius:12px; padding:10px 4px; text-align:center; cursor:pointer; transition:all 0.2s; }
        .cat-pick.selected { border-color:var(--bordeaux); background:var(--bordeaux-bg); }
        .cat-pick-icon { font-size:22px; display:block; margin-bottom:4px; }
        .cat-pick-name { font-size:9px; font-weight:700; text-transform:uppercase; color:var(--text-muted); }
        .btn-row { display:flex; gap:10px; margin-top:22px; }
        .btn-cancel { flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:14px; color:var(--text-mid); font-family:'Barlow',sans-serif; font-size:15px; font-weight:600; cursor:pointer; transition:all 0.2s; }
        .btn-cancel:hover { background:var(--border); }
        .btn-confirm { flex:2; background:var(--bordeaux); border:none; border-radius:12px; padding:14px; color:white; font-family:'Barlow Condensed',sans-serif; font-size:18px; font-weight:700; letter-spacing:0.5px; cursor:pointer; transition:all 0.2s; box-shadow:0 4px 14px rgba(130,7,42,0.30); }
        .btn-confirm:hover { background:var(--bordeaux-lite); }
        .info-box { background:var(--bordeaux-bg); border:1px solid rgba(130,7,42,0.12); border-radius:12px; padding:13px 16px; font-size:13px; color:var(--text-mid); }
        .settings-row { display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--border); }
        .settings-row:last-child { border-bottom:none; }
        .settings-row-left { flex:1; }
        .settings-row-label { font-size:14px; font-weight:600; color:var(--text); }
        .settings-row-sub { font-size:12px; color:var(--text-muted); margin-top:2px; }
        .toggle { width:44px; height:26px; background:var(--border-strong); border-radius:13px; position:relative; cursor:pointer; transition:background 0.3s; flex-shrink:0; border:none; }
        .toggle.on { background:var(--bordeaux); }
        .toggle::after { content:''; position:absolute; width:20px; height:20px; background:white; border-radius:50%; top:3px; left:3px; transition:transform 0.3s; box-shadow:0 1px 4px rgba(0,0,0,0.2); }
        .toggle.on::after { transform:translateX(18px); }
        .btn-danger { width:100%; background:var(--red-bg); border:1px solid rgba(220,38,38,0.2); border-radius:12px; padding:14px; color:var(--red); font-family:'Barlow',sans-serif; font-size:15px; font-weight:600; cursor:pointer; transition:all 0.2s; text-align:center; margin-top:8px; }
        .btn-danger:hover { background:rgba(220,38,38,0.12); }
        .type-toggle { display:flex; gap:8px; margin-bottom:16px; }
        .type-btn { flex:1; padding:12px; border-radius:12px; border:2px solid var(--border); background:var(--surface2); font-family:'Barlow Condensed',sans-serif; font-size:17px; font-weight:700; cursor:pointer; transition:all 0.2s; text-align:center; }
        .type-btn.active-depense { border-color:var(--bordeaux); background:var(--bordeaux-bg); color:var(--bordeaux); }
        .type-btn.active-versement { border-color:var(--green); background:var(--green-bg); color:var(--green); }
 inset:0; background:rgba(0,0,0,0.45); backdrop-filter:blur(6px); z-index:300; display:flex; align-items:center; justify-content:center; padding:24px; animation:fadeIn 0.2s ease; }
        .confirm-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(6px); z-index:999; display:flex; align-items:center; justify-content:center; padding:24px; animation:fadeIn 0.2s ease; }
        .confirm-box { background:var(--white); border-radius:20px; padding:28px 24px; width:100%; max-width:320px; box-shadow:0 16px 48px rgba(0,0,0,0.2); text-align:center; }
        .confirm-icon { font-size:40px; margin-bottom:16px; display:block; }
        .confirm-title { font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:700; color:var(--text); margin-bottom:10px; }
        .confirm-text { font-size:14px; color:var(--text-muted); line-height:1.5; margin-bottom:24px; }
        .confirm-btns { display:flex; gap:10px; }
        .confirm-cancel { flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:13px; color:var(--text-mid); font-family:'Barlow',sans-serif; font-size:15px; font-weight:600; cursor:pointer; }
        .confirm-ok { flex:1; background:var(--red); border:none; border-radius:12px; padding:13px; color:white; font-family:'Barlow Condensed',sans-serif; font-size:17px; font-weight:700; cursor:pointer; }
        .confirm-ok:hover { background:#b91c1c; }

        /* ── SMART BLOC ── */
        .smart-card { margin:12px 16px 0; border-radius:16px; padding:16px 18px; box-shadow:var(--shadow-sm); border:1px solid; }
        .smart-card.ok    { background:#f0fdf4; border-color:rgba(22,163,74,0.2); }
        .smart-card.warn  { background:#fffbeb; border-color:rgba(245,158,11,0.3); }
        .smart-card.danger{ background:#fef2f2; border-color:rgba(220,38,38,0.2); }
        .smart-header { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
        .smart-emoji { font-size:20px; }
        .smart-title { font-family:'Barlow Condensed',sans-serif; font-size:17px; font-weight:700; }
        .smart-card.ok     .smart-title { color:#15803d; }
        .smart-card.warn   .smart-title { color:#b45309; }
        .smart-card.danger .smart-title { color:#dc2626; }
        .smart-msg { font-size:13px; line-height:1.55; margin-bottom:12px; }
        .smart-card.ok     .smart-msg { color:#166534; }
        .smart-card.warn   .smart-msg { color:#92400e; }
        .smart-card.danger .smart-msg { color:#991b1b; }
        .smart-chips { display:flex; gap:8px; flex-wrap:wrap; }
        .smart-chip { border-radius:20px; padding:6px 12px; font-size:12px; font-weight:600; }
        .smart-card.ok     .smart-chip { background:rgba(22,163,74,0.12); color:#15803d; }
        .smart-card.warn   .smart-chip { background:rgba(245,158,11,0.15); color:#b45309; }
        .smart-card.danger .smart-chip { background:rgba(220,38,38,0.12); color:#dc2626; }

        /* ── EPARGNE AVANCEE ── */
        .epargne-card { background:var(--white); border:1px solid var(--border); border-radius:16px; padding:20px; box-shadow:var(--shadow-sm); margin-bottom:12px; }
        .epargne-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
        .epargne-title { font-family:'Barlow Condensed',sans-serif; font-size:20px; font-weight:700; color:var(--text); display:flex; align-items:center; gap:8px; }
        .epargne-badge { background:var(--green-bg); border:1px solid rgba(22,163,74,0.2); border-radius:20px; padding:4px 12px; font-size:12px; font-weight:700; color:var(--green); }
        .epargne-badge.warn { background:#fffbeb; border-color:rgba(245,158,11,0.3); color:#b45309; }
        .epargne-badge.danger { background:var(--red-bg); border-color:rgba(220,38,38,0.2); color:var(--red); }
        .epargne-montant-row { display:flex; align-items:baseline; gap:6px; margin-bottom:6px; }
        .epargne-montant-big { font-family:'Barlow Condensed',sans-serif; font-size:42px; font-weight:800; color:var(--green); }
        .epargne-montant-sur { font-size:16px; color:var(--text-muted); font-weight:500; }
        .epargne-objectif { font-size:13px; color:var(--text-muted); margin-bottom:14px; }
        .epargne-progress { height:10px; background:var(--surface2); border-radius:5px; overflow:hidden; border:1px solid var(--border); margin-bottom:6px; }
        .epargne-progress-fill { height:100%; border-radius:5px; transition:width 0.6s ease; }
        .epargne-progress-label { display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted); margin-bottom:16px; }
        .btn-virer { width:100%; background:linear-gradient(135deg,#16a34a,#15803d); border:none; border-radius:12px; padding:14px; color:white; font-family:'Barlow Condensed',sans-serif; font-size:18px; font-weight:700; cursor:pointer; transition:all 0.2s; box-shadow:0 4px 14px rgba(22,163,74,0.25); display:flex; align-items:center; justify-content:center; gap:8px; }
        .btn-virer:hover { background:linear-gradient(135deg,#15803d,#166534); transform:translateY(-1px); }
        .btn-virer:disabled { background:#d1d5db; box-shadow:none; cursor:not-allowed; transform:none; }

        /* ── BUDGET PAGE ── */

        .savings-goal-input:focus { outline:none; border-color:var(--green); }
        .savings-progress-bar { height:8px; background:rgba(22,163,74,0.15); border-radius:4px; overflow:hidden; margin-top:12px; }
        .savings-progress-fill { height:100%; background:var(--green); border-radius:4px; transition:width 0.6s ease; }

</head>
<body>

<div id="lock"></div>
<div id="app" style="display:none;"></div>
<div id="confirm"></div>

<script>
let S = {
    income:0, transactions:[], modal:null, page:'dashboard',
    form:{ amount:'', category:'Bouffe', description:'', type:'depense' },
    incomeInput:'', pinInput:'', lockStep:'enter',
    pinFirst:'', lockError:'', bioAvailable:false,
    weeklyBudget:200, weeklyBudgetInput:'200',
    savingsGoalMonthly:100, savingsGoalMonthlyInput:'100',
    budgetLimits:{ Bouffe:0, Transport:0, Loisirs:0, Logement:0, Savings:0, 'Prêt':0 },
    savingsGoal:0, savingsGoalInput:'0',
    showVirerModal:false, virerAmount:0,
};

const CATS = [
    { name:'Bouffe',    icon:'🍔', color:'#f97316', bg:'#fff7ed' },
    { name:'Transport', icon:'🚗', color:'#ef4444', bg:'#fef2f2' },
    { name:'Loisirs',   icon:'🎮', color:'#8b5cf6', bg:'#f5f3ff' },
    { name:'Logement',  icon:'🏠', color:'#06b6d4', bg:'#ecfeff' },
    { name:'Savings',   icon:'💰', color:'#16a34a', bg:'#f0fdf4' },
    { name:'Prêt',      icon:'🏦', color:'#64748b', bg:'#f1f5f9' },
];

// ── STORAGE ──
function load() {
    S.income               = parseFloat(localStorage.getItem('budget_income') || '0');
    S.incomeInput          = S.income.toString();
    S.weeklyBudget         = parseFloat(localStorage.getItem('budget_weekly') || '200');
    S.weeklyBudgetInput    = S.weeklyBudget.toString();
    S.savingsGoalMonthly   = parseFloat(localStorage.getItem('budget_savings_monthly') || '100');
    S.savingsGoalMonthlyInput = S.savingsGoalMonthly.toString();
    S.savingsGoal          = parseFloat(localStorage.getItem('budget_savings_goal') || '0');
    S.savingsGoalInput     = S.savingsGoal.toString();
    const raw = localStorage.getItem('budget_tx');
    if (raw) {
        const cutoff = new Date();
        cutoff.setMonth(cutoff.getMonth() - 3);
        cutoff.setDate(1);
        cutoff.setHours(0,0,0,0);
        S.transactions = JSON.parse(raw).filter(t => new Date(t.date) >= cutoff);
    }
    const limits = localStorage.getItem('budget_limits');
    if (limits) S.budgetLimits = JSON.parse(limits);
}

function save() {
    localStorage.setItem('budget_income',          S.income);
    localStorage.setItem('budget_weekly',          S.weeklyBudget);
    localStorage.setItem('budget_savings_monthly', S.savingsGoalMonthly);
    localStorage.setItem('budget_tx',              JSON.stringify(S.transactions));
    localStorage.setItem('budget_limits',          JSON.stringify(S.budgetLimits));
    localStorage.setItem('budget_savings_goal',    S.savingsGoal);
}

function getPin()        { return localStorage.getItem('budget_pin') || ''; }
function setPin(p)       { localStorage.setItem('budget_pin', p); }
function getBioEnabled() { return localStorage.getItem('budget_bio') === '1'; }
function setBioEnabled(v){ localStorage.setItem('budget_bio', v ? '1' : '0'); }

// ── BIO ──
async function checkBioAvailable() {
    if (!window.PublicKeyCredential) return false;
    try { return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }
    catch { return false; }
}

async function tryBio() {
    try {
        const challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
        await navigator.credentials.get({ publicKey:{ challenge, timeout:60000, userVerification:'required', rpId:location.hostname||'localhost' }});
        unlock();
    } catch { S.lockError='Empreinte non reconnue'; renderLock(); }
}

async function registerBio() {
    try {
        const challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
        const userId = new Uint8Array(16); crypto.getRandomValues(userId);
        await navigator.credentials.create({ publicKey:{ challenge, timeout:60000, rp:{ name:'Budget App', id:location.hostname||'localhost' }, user:{ id:userId, name:'user', displayName:'Utilisateur' }, pubKeyCredParams:[{ type:'public-key', alg:-7 }], authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required' }}});
        setBioEnabled(true);
    } catch { setBioEnabled(false); }
    S.modal='settings'; renderApp();
}

// ── LOCK ──
function unlock() {
    document.getElementById('lock').innerHTML='';
    document.getElementById('app').style.display='';
    renderApp();
}

function pinPress(digit) {
    if (S.pinInput.length>=4) return;
    S.pinInput+=digit; S.lockError=''; renderLock();
    if (S.pinInput.length===4) {
        setTimeout(() => {
            if (S.lockStep==='setup') { S.pinFirst=S.pinInput; S.pinInput=''; S.lockStep='confirm'; renderLock(); }
            else if (S.lockStep==='confirm') {
                if (S.pinInput===S.pinFirst) { setPin(S.pinInput); S.pinInput=''; S.lockStep='enter'; unlock(); }
                else { S.lockError='Les PIN ne correspondent pas'; S.pinInput=''; S.pinFirst=''; S.lockStep='setup'; renderLock(); }
            } else {
                if (S.pinInput===getPin()) { S.pinInput=''; unlock(); }
                else { S.lockError='PIN incorrect'; S.pinInput=''; setTimeout(()=>{ S.lockError=''; renderLock(); },1200); renderLock(); }
            }
        }, 120);
    }
}

function pinDel() { if (S.pinInput.length>0) { S.pinInput=S.pinInput.slice(0,-1); renderLock(); }}

function renderLock() {
    const hasPin=!!getPin(), bioEnabled=getBioEnabled();
    let title, sub;
    if (S.lockStep==='setup') { title='Créer un PIN'; sub='Choisis un code à 4 chiffres\npour protéger ton budget'; }
    else if (S.lockStep==='confirm') { title='Confirmer'; sub='Saisis à nouveau ton PIN\npour confirmer'; }
    else { title='Bon retour !'; sub='Saisis ton PIN\npour accéder à ton budget'; }

    const dots=[0,1,2,3].map(i=>`<div class="pin-dot ${S.pinInput.length>i?(S.lockError?'error':'filled'):''}"></div>`).join('');
    const pad=[['1','2','3'],['4','5','6'],['7','8','9'],['','0','⌫']].map(row=>row.map(k=>{
        if(k==='') return `<div class="pin-key empty"></div>`;
        if(k==='⌫') return `<div class="pin-key del" onclick="pinDel()">⌫</div>`;
        return `<div class="pin-key" onclick="pinPress('${k}')">${k}</div>`;
    }).join('')).join('');
    const bioBtn=(S.lockStep==='enter'&&hasPin&&bioEnabled&&S.bioAvailable)?`<button class="bio-btn" onclick="tryBio()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a5 5 0 0 1 5 5v3a5 5 0 0 1-10 0V7a5 5 0 0 1 5-5z"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>Empreinte / Face ID</button>`:'';

    document.getElementById('lock').innerHTML=`
        <div class="lock-screen">
            <div class="lock-logo">B</div>
            <div class="lock-title">${title}</div>
            <div class="lock-sub">${sub}</div>
            <div class="pin-dots">${dots}</div>
            <div class="lock-error">${S.lockError}</div>
            <div class="pin-pad">${pad}</div>
            ${bioBtn}
        </div>`;
}

// ── COMPUTED ──
function monthTx() {
    const now=new Date();
    return S.transactions.filter(t=>{ const d=new Date(t.date); return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear(); });
}
function monthDepenses()   { return monthTx().filter(t=>t.type!=='versement'); }
function monthVersements() { return monthTx().filter(t=>t.type==='versement'); }
function totalSpent()      { return monthDepenses().reduce((s,t)=>s+t.amount,0); }
function totalVersements() { return monthVersements().reduce((s,t)=>s+t.amount,0); }
function byCategory()      { const r={}; CATS.forEach(c=>{ r[c.name]=monthDepenses().filter(t=>t.category===c.name).reduce((s,t)=>s+t.amount,0); }); return r; }
function prevMonthTx() {
    const now=new Date();
    const prev=new Date(now.getFullYear(), now.getMonth()-1, 1);
    return S.transactions.filter(t=>{ const d=new Date(t.date); return d.getMonth()===prev.getMonth()&&d.getFullYear()===prev.getFullYear(); });
}
function catInfo(name) { return CATS.find(c=>c.name===name)||{ icon:'📦', color:'#6b7280', bg:'#f3f4f6' }; }
function fmtDate(iso)  { const d=new Date(iso),now=new Date(),yest=new Date(); yest.setDate(yest.getDate()-1); if(d.toDateString()===now.toDateString()) return"Aujourd'hui"; if(d.toDateString()===yest.toDateString()) return"Hier"; return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}); }

// ── ACTIONS ──
function addTx() {
    const amt=parseFloat(S.form.amount);
    if(!amt||amt<=0) return;
    S.transactions.push({
        id:Date.now(), amount:amt,
        category:S.form.type==='versement'?'Versement':S.form.category,
        description:S.form.description.trim(),
        date:new Date().toISOString(),
        type:S.form.type
    });
    S.form={ amount:'', category:'Bouffe', description:'', type:'depense' };
    S.modal=null; save(); renderApp();
}

function deleteTx(id) { S.transactions=S.transactions.filter(t=>t.id!==id); save(); renderApp(); }

function saveSettings() {
    const v = parseFloat(S.incomeInput);
    const w = parseFloat(S.weeklyBudgetInput);
    const g = parseFloat(S.savingsGoalMonthlyInput);
    if (!isNaN(v) && v >= 0) S.income = v;
    if (!isNaN(w) && w > 0)  S.weeklyBudget = w;
    if (!isNaN(g) && g >= 0) S.savingsGoalMonthly = g;
    S.modal = null; save(); renderApp();
}

function saveBudgetLimit(cat, val) {
    const v=parseFloat(val)||0;
    S.budgetLimits[cat]=v; save();
}

function saveSavingsGoal() {
    const v=parseFloat(S.savingsGoalInput)||0;
    S.savingsGoal=v; save(); renderApp();
}

function resetDepenses() {
    document.getElementById('confirm').innerHTML=`
        <div class="confirm-overlay">
            <div class="confirm-box">
                <span class="confirm-icon">🗑️</span>
                <div class="confirm-title">Reset les dépenses ?</div>
                <div class="confirm-text">Toutes tes transactions du mois seront supprimées. Cette action est irréversible.</div>
                <div class="confirm-btns">
                    <button class="confirm-cancel" onclick="closeConfirm()">Annuler</button>
                    <button class="confirm-ok" onclick="doReset()">Reset</button>
                </div>
            </div>
        </div>`;
}

function doReset() {
    const now=new Date();
    S.transactions=S.transactions.filter(t=>{ const d=new Date(t.date); return!(d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()); });
    save(); closeConfirm(); S.modal=null; renderApp();
}

function closeConfirm() { document.getElementById('confirm').innerHTML=''; }

function changePin() {
    S.pinInput=''; S.pinFirst=''; S.lockStep='setup'; S.lockError='';
    document.getElementById('app').style.display='none'; renderLock();
}

function toggleBio() {
    if(getBioEnabled()) { setBioEnabled(false); renderApp(); }
    else { registerBio(); }
}

// ── SMART BLOC ──
function buildSmartBloc(remain, spent, versements) {
    var now         = new Date();
    var totalDays   = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    var daysPassed  = now.getDate();
    var daysLeft    = totalDays - daysPassed;
    var budget      = S.income + versements;

    // ── Budget hebdo fixe 200€ ──
    var WEEKLY_BUDGET = S.weeklyBudget || 200;

    // Semaine en cours (lundi → dimanche)
    var dayOfWeek       = now.getDay() === 0 ? 7 : now.getDay(); // 1=lun, 7=dim
    var daysIntoWeek    = dayOfWeek - 1;                          // jours écoulés cette semaine
    var daysLeftWeek    = 7 - dayOfWeek;                          // jours restants cette semaine

    // Dépenses de cette semaine uniquement
    var weekStart = new Date(now);
    weekStart.setDate(now.getDate() - daysIntoWeek);
    weekStart.setHours(0,0,0,0);

    var spentThisWeek = monthDepenses()
        .filter(function(t) { return new Date(t.date) >= weekStart; })
        .reduce(function(s,t) { return s + t.amount; }, 0);

    var remainWeek    = WEEKLY_BUDGET - spentThisWeek;
    var perDayWeek    = daysLeftWeek > 0 ? remainWeek / daysLeftWeek : 0;

    // Rythme journalier global
    var dailyRate     = daysPassed > 0 ? spent / daysPassed : 0;
    var projectedEnd  = dailyRate * totalDays;
    var projectedOver = projectedEnd - budget;

    // Projection fin de mois avec budget hebdo
    var totalWeeks    = Math.ceil(totalDays / 7);
    var projectedMonthly = WEEKLY_BUDGET * totalWeeks;

    // Niveau d'alerte
    var weekOver  = spentThisWeek > WEEKLY_BUDGET;
    var weekWarn  = spentThisWeek > WEEKLY_BUDGET * 0.80;
    var level, emoji, title, msg, extra;

    if (remain < 0) {
        level = 'danger'; emoji = '🚨'; title = 'Budget mensuel dépassé !';
        msg   = 'Tu es en négatif de <strong>' + Math.abs(remain).toFixed(0) + '€</strong> ce mois-ci. Stop les dépenses jusqu\'à la fin du mois.';
        extra = '';
    } else if (weekOver) {
        level = 'danger'; emoji = '🚨'; title = 'Budget semaine dépassé !';
        msg   = 'Tu as dépensé <strong>' + spentThisWeek.toFixed(0) + '€</strong> cette semaine, soit <strong>' + (spentThisWeek - WEEKLY_BUDGET).toFixed(0) + '€ de trop</strong> sur ton budget de ' + WEEKLY_BUDGET + '€/semaine.';
        extra = daysLeftWeek > 0 ? '<br><br>Essaie de ne plus dépenser jusqu\'à <strong>' + (dayOfWeek === 7 ? 'lundi' : 'dimanche') + '</strong> pour limiter les dégâts.' : '';
    } else if (weekWarn) {
        level = 'warn'; emoji = '⚠️'; title = 'Attention cette semaine';
        msg   = 'Tu as dépensé <strong>' + spentThisWeek.toFixed(0) + '€</strong> sur ton budget de <strong>' + WEEKLY_BUDGET + '€</strong> cette semaine (' + ((spentThisWeek/WEEKLY_BUDGET)*100).toFixed(0) + '%).';
        extra = daysLeftWeek > 0 ? '<br><br>Il te reste <strong>' + remainWeek.toFixed(0) + '€</strong> pour <strong>' + daysLeftWeek + ' jour' + (daysLeftWeek > 1 ? 's' : '') + '</strong> — soit <strong>' + perDayWeek.toFixed(0) + '€/jour</strong> max.' : '';
    } else {
        level = 'ok'; emoji = '✅'; title = 'Budget semaine OK';
        msg   = 'Tu as dépensé <strong>' + spentThisWeek.toFixed(0) + '€</strong> sur <strong>' + WEEKLY_BUDGET + '€</strong> cette semaine. C\'est bien !';
        extra = daysLeftWeek > 0 ? '<br><br>Il te reste <strong>' + remainWeek.toFixed(0) + '€</strong> pour <strong>' + daysLeftWeek + ' jour' + (daysLeftWeek > 1 ? 's' : '') + '</strong> — soit <strong>' + perDayWeek.toFixed(0) + '€/jour</strong> à ne pas dépasser.' : '';
    }

    var chips = [];
    chips.push('📅 Semaine : ' + spentThisWeek.toFixed(0) + '€ / ' + WEEKLY_BUDGET + '€');
    if (daysLeftWeek > 0) chips.push('📆 ' + perDayWeek.toFixed(0) + '€/jour restant');
    chips.push('🗓️ Reste mois : ' + remain.toFixed(0) + '€');
    if (dailyRate > 0) chips.push('📊 Rythme : ' + dailyRate.toFixed(0) + '€/jour');

    var chipsHtml = chips.map(function(c) { return '<span class="smart-chip">' + c + '</span>'; }).join('');

    return '<div class="smart-card ' + level + '">'
         + '<div class="smart-header"><span class="smart-emoji">' + emoji + '</span><span class="smart-title">' + title + '</span></div>'
         + '<div class="smart-msg">' + msg + extra + '</div>'
         + '<div class="smart-chips">' + chipsHtml + '</div>'
         + '</div>';
}


function buildDonut(catAmt, total) {
    if(total===0) return `<svg class="donut-svg" width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="45" fill="none" stroke="#e8eaee" stroke-width="18"/></svg>`;
    const R=45, cx=60, cy=60, stroke=18;
    const circumference=2*Math.PI*R;
    let offset=0;
    let slices='';
    CATS.forEach(c => {
        const amt=catAmt[c.name];
        if(amt<=0) return;
        const pct=amt/total;
        const dash=pct*circumference;
        const rotate=-90+(offset/circumference)*360;
        slices+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${c.color}" stroke-width="${stroke}" stroke-dasharray="${dash} ${circumference-dash}" stroke-dashoffset="${-offset}" transform="rotate(${rotate} ${cx} ${cy})" stroke-linecap="butt"/>`;
        offset+=dash;
    });
    return `<svg class="donut-svg" width="120" height="120" viewBox="0 0 120 120">${slices}<circle cx="${cx}" cy="${cy}" r="${R-stroke/2-2}" fill="white"/><text x="${cx}" y="${cy+4}" text-anchor="middle" font-family="Barlow Condensed" font-weight="800" font-size="14" fill="#1a1d23">${total.toFixed(0)}€</text></svg>`;
}

// ── RENDER BUDGET ──
function calculEpargneReelle(remain, spent) {
    // Marge de sécurité : toujours garder 50€ de tampon
    var TAMPON = 50;
    var disponible = remain - TAMPON;
    if (disponible <= 0) return { montant: 0, technique: null, impossible: true };

    var objectif = S.savingsGoalMonthly;

    // Règle 50/30/20 : 20% du revenu
    var regle2020 = Math.round(S.income * 0.20);
    // Règle 10% : épargne minimale
    var regle10   = Math.round(S.income * 0.10);
    // Pay yourself first : objectif fixe en premier
    var payFirst  = objectif;
    // Épargne résiduelle : ce qui reste vraiment
    var residuelle = Math.floor(disponible);

    // Recommandation honnête : le min entre objectif et ce qu'on peut vraiment
    var recommande = Math.min(objectif, residuelle);
    // Si on peut faire mieux que l'objectif, on le signale mais on recommande l'objectif
    var surplus = residuelle > objectif ? residuelle - objectif : 0;

    return {
        montant:    Math.max(0, recommande),
        residuelle: residuelle,
        regle20:    regle2020,
        regle10:    regle10,
        payFirst:   payFirst,
        surplusDisponible: surplus,
        impossible: recommande <= 0,
        peutFaireObjectif: residuelle >= objectif,
    };
}

function getHistoriqueEpargne() {
    var now = new Date();
    var result = [];
    for (var i = 1; i >= 0; i--) {
        var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        var moisTx = S.transactions.filter(function(t) {
            var td = new Date(t.date);
            return td.getMonth() === d.getMonth() && td.getFullYear() === d.getFullYear() && t.category === 'Savings';
        });
        var total = moisTx.reduce(function(s,t) { return s+t.amount; }, 0);
        result.push({
            mois: d.toLocaleDateString('fr-FR', { month:'long', year:'numeric' }),
            montant: total,
            objectif: S.savingsGoalMonthly,
        });
    }
    return result;
}

}

            html += '<div class="conseil-item"><div class="conseil-bullet"></div><div class="conseil-text">' + a + '</div></div>';

            </div>
            <div class="nav-item ${S.page==='budget'?'active':''}" onclick="S.page='budget'; renderApp();">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                <span>Budget</span>
            </div>
            <div class="nav-item ${S.page==='stats'?'active':''}" onclick="S.page='stats'; renderApp();">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                <span>Stats</span>
            </div>
        </div>

        ${S.modal==='add'?`
            <div class="modal-overlay" onclick="if(event.target===this){S.modal=null;renderApp();}">
                <div class="modal-sheet">
                    <div class="modal-handle"></div>
                    <div class="modal-title">${S.form.type==='versement'?'Nouveau versement':'Nouvelle dépense'} <div class="modal-close" onclick="S.modal=null;renderApp();">✕</div></div>
                    <div class="type-toggle">
                        <button class="type-btn ${S.form.type==='depense'?'active-depense':''}" onclick="S.form.type='depense'; renderApp();">💸 Dépense</button>
                        <button class="type-btn ${S.form.type==='versement'?'active-versement':''}" onclick="S.form.type='versement'; renderApp();">💰 Versement</button>
                    </div>
                    <div class="form-group"><label class="form-label">Montant</label><input class="form-input big" type="number" placeholder="0.00" value="${S.form.amount}" oninput="S.form.amount=this.value;" /></div>
                    ${S.form.type==='depense'?`<div class="form-group"><label class="form-label">Catégorie</label><div class="cats-picker">${CATS.map(c=>`<div class="cat-pick ${S.form.category===c.name?'selected':''}" onclick="S.form.category='${c.name}'; renderApp();"><span class="cat-pick-icon">${c.icon}</span><div class="cat-pick-name">${c.name}</div></div>`).join('')}</div></div>`:''}
                    <div class="form-group"><label class="form-label">Description (optionnel)</label><input class="form-input" type="text" placeholder="${S.form.type==='versement'?'Ex: Prime, Virement...':'Ex: Courses, Essence...'}" value="${S.form.description}" oninput="S.form.description=this.value;" /></div>
                    <div class="btn-row"><button class="btn-cancel" onclick="S.modal=null;renderApp();">Annuler</button><button class="btn-confirm" style="${S.form.type==='versement'?'background:var(--green);box-shadow:0 4px 14px rgba(22,163,74,0.3);':''}" onclick="addTx();">Ajouter</button></div>
                </div>
            </div>
        `:''}

        ${S.modal==='settings'?`
            <div class="modal-overlay" onclick="if(event.target===this){S.modal=null;renderApp();}">
                <div class="modal-sheet">
                    <div class="modal-handle"></div>
                    <div class="modal-title">Paramètres <div class="modal-close" onclick="S.modal=null;renderApp();">✕</div></div>
                    <div class="form-group"><label class="form-label">Revenu mensuel</label><input class="form-input big" type="number" placeholder="0.00" value="${S.incomeInput}" oninput="S.incomeInput=this.value;" /></div>
                    <div class="form-group"><label class="form-label">Budget max par semaine</label><input class="form-input big" type="number" placeholder="200" value="${S.weeklyBudgetInput}" oninput="S.weeklyBudgetInput=this.value;" /></div>
                    <div class="form-group"><label class="form-label">Objectif épargne mensuel</label><input class="form-input big" type="number" placeholder="100" value="${S.savingsGoalMonthlyInput}" oninput="S.savingsGoalMonthlyInput=this.value;" /></div>
                    <div style="margin-bottom:16px;">
                        <div class="settings-row"><div class="settings-row-left"><div class="settings-row-label">🔑 Modifier le PIN</div><div class="settings-row-sub">Changer ton code à 4 chiffres</div></div><button class="btn-cancel" style="flex:none;padding:8px 14px;font-size:13px;" onclick="changePin();">Modifier</button></div>
                        ${S.bioAvailable?`<div class="settings-row"><div class="settings-row-left"><div class="settings-row-label">🫆 Empreinte / Face ID</div><div class="settings-row-sub">${bioEnabled?'Activé':'Désactivé'}</div></div><button class="toggle ${bioEnabled?'on':''}" onclick="toggleBio();"></button></div>`:''}
                    </div>
                    <div class="info-box" style="margin-bottom:12px;">💾 Données stockées uniquement sur ton appareil. Historique conservé sur 2 mois glissants.</div>
                    <button class="btn-danger" onclick="resetDepenses();">🗑️ Reset les dépenses du mois</button>
                    <div class="btn-row"><button class="btn-cancel" onclick="S.modal=null;renderApp();">Annuler</button><button class="btn-confirm" onclick="saveSettings();">Enregistrer</button></div>
                </div>
            </div>
        `:''}
    `;
}

// ── INIT ──
async function init() {
    load();
    S.bioAvailable=await checkBioAvailable();
    const hasPin=!!getPin();
    if(!hasPin) { S.lockStep='setup'; renderLock(); }
    else { S.lockStep='enter'; renderLock(); if(getBioEnabled()&&S.bioAvailable) setTimeout(()=>tryBio(),500); }
}

init();
</script>
</body>
</html>
